name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          make lint

      - name: Test
        run: make test

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: next/web/.nvmrc
          cache: npm
          cache-dependency-path: next/web/package-lock.json

      - name: Rebuild the web front
        run: make ui

      # The front's build is committed for `go install`: it must be the one its sources give.
      - name: Verify the committed build is current
        run: |
          git diff --exit-code -- next/internal/web/dist
          test -z "$(git status --porcelain -- next/internal/web/dist)" || { git status --porcelain -- next/internal/web/dist; exit 1; }
