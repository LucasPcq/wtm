name: Docs site

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "site/**"
      - ".github/workflows/docs-site.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Archived versions are read from release tags, so the build needs the tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The published site documents the release it was tagged from, so links into
      # the code point at that tag rather than at main.
      - name: Build
        working-directory: site
        env:
          DOCS_REF: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: npm run build

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    # A prerelease tag (v0.30.0-beta.1) must not replace the docs of the latest release.
    if: github.event_name != 'pull_request' && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
