version: 2

builds:
  - main: .
    binary: wtm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/LucasPcq/wtm/internal/domain.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# A tag carrying a prerelease part (v0.28.0-beta.1) is published as a GitHub
# pre-release, which keeps it out of /releases/latest — the endpoint the passive
# update check and `wtm upgrade` read. Without this a beta would be offered to
# every stable install.
release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: wtm
    # Same reason: a prerelease must not bump the formula every `brew upgrade`
    # would then install. Testers take a beta through `wtm upgrade --version`.
    skip_upload: auto
    repository:
      owner: LucasPcq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://wtm.sh"
    description: "Worktree Manager — orchestrate git worktrees, AI agents, and team workflows"
    license: "MIT"
    install: |
      bin.install "wtm"
