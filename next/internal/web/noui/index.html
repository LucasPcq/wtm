<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wtm</title>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 28rem; text-align: center; }
  .mark { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; font-weight: 700; font-size: 1.125rem; }
  .dot { fill: #17142a; } .l1 { stroke: #d0582f; } .l2 { stroke: #5b4be0; } .l3 { stroke: #159c88; }
  @media (prefers-color-scheme: dark) { .dot { fill: #f4f1fa; } .l1 { stroke: #e8734a; } .l2 { stroke: #9b8cff; } .l3 { stroke: #5fd4c0; } }
  h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 .75rem; }
  p { margin: 0; line-height: 1.5; opacity: .7; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><circle cx="4" cy="12" r="3" class="dot"/><path d="M6 12 C14 12 14 4 22 4 H27" fill="none" stroke-width="3" stroke-linecap="round" class="l1"/><path d="M6 12 H27" fill="none" stroke-width="3" stroke-linecap="round" class="l2"/><path d="M6 12 C14 12 14 20 22 20 H27" fill="none" stroke-width="3" stroke-linecap="round" class="l3"/></svg>
    wtm
  </div>
  <h1>This wtm has no web interface</h1>
  <p>It was built with the noui tag. The server and its API under /api still answer. Install a release build to get the interface.</p>
</main>
</body>
</html>
