# revive for next/ (make next-lint): Go's doc-comment and naming conventions, see .claude/skills/go-style/references/tooling.md.
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.exported]
[rule.package-comments]
[rule.var-naming]
[rule.receiver-naming]
[rule.error-strings]
[rule.error-naming]
[rule.error-return]
[rule.context-as-argument]
[rule.indent-error-flow]
[rule.early-return]
[rule.unexported-return]
[rule.blank-imports]
[rule.errorf]
[rule.increment-decrement]
[rule.range]
[rule.time-naming]
[rule.var-declaration]
[rule.dot-imports]
[rule.superfluous-else]
[rule.unreachable-code]
[rule.redefines-builtin-id]
